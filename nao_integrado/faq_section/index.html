<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perguntas Frequentes - LGPD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="faq" class="py-16">
    <div class="container">
      <div class="mb-10">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-1 h-6 rounded-full" style="background-color: #F6891F;"></div>
          <span class="font-bold text-xs uppercase tracking-015em" style="color: #F6891F;">Dúvidas Frequentes</span>
        </div>
        <h2 class="text-3xl font-bold text-slate-900 mb-4" style="font-family: 'Sora', sans-serif;">
          Perguntas Frequentes sobre LGPD
        </h2>
        <p class="text-slate-600 max-w-2xl text-lg leading-relaxed">
          Respostas para as dúvidas mais comuns da comunidade acadêmica sobre proteção de dados pessoais e a LGPD.
        </p>
      </div>

      <div class="search-container mb-6">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar nas perguntas frequentes..." class="search-input">
      </div>

      <div class="flex flex-wrap gap-2 mb-6" id="category-filters">
      </div>

      <div class="faq-list" id="faq-list">
      </div>

      <div class="cta-box mt-8">
        <p class="cta-text mb-3">
          Não encontrou a resposta que procurava? Entre em contato diretamente com o DPO.
        </p>
        <a href="#contato-dpo" class="cta-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <path d="M12 17h.01"></path>
          </svg>
          Enviar Pergunta ao DPO
        </a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
