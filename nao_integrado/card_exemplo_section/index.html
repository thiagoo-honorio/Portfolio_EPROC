<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 Princípios da LGPD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="barra-ferramentas">
    <button id="btn-editar-toggle" onclick="toggleModoEdicao()">Modo Edição</button>
  </div>

  <div id="toolbar-edicao" class="toolbar-edicao">
    <button onclick="adicionarCard()">+ Adicionar Card</button>
    <button class="btn-salvar-arquivo" onclick="salvarArquivo()">Salvar Alterações</button>
    <button onclick="importarJSON()">Carregar JSON</button>
    <button onclick="restaurarPadrao()">Restaurar Padrão</button>
    <input type="file" id="input-importar" accept=".json" style="display:none" onchange="lerImportado(event)">
  </div>

  <section id="principios" class="py-16 bg-white">
    <div class="container">
      <div class="mb-12">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-1 h-6 rounded-full" id="secao-barra" style="background-color: #F6891F;"></div>
          <span class="font-bold text-xs uppercase tracking-015em" id="secao-tag" style="color: #F6891F;">Art. 6º da LGPD</span>
          <input type="color" id="secao-cor-input" class="secao-cor-picker" value="#F6891F" onchange="mudarCorSecao(this.value)">
        </div>
        <h2 class="text-3xl font-bold text-slate-900 mb-4" id="secao-titulo" style="font-family: 'Sora', sans-serif;">
          Os 10 Princípios do Tratamento de Dados
        </h2>
        <p class="text-slate-600 max-w-2xl text-lg leading-relaxed" id="secao-descricao">
          Todo tratamento de dados pessoais na universidade deve observar a boa-fé e estes princípios fundamentais.
          Clique em cada princípio para ver exemplos práticos.
        </p>
      </div>

      <div class="grid principios-grid gap-3" id="principios-grid">
      </div>
    </div>
  </section>

  <div id="modal-editor" class="modal-overlay" onclick="if(event.target===this)fecharEditor()">
    <div class="modal-conteudo">
      <h3>Editar Card</h3>
      <label>Título</label>
      <input type="text" id="edit-title">
      <label>Cor</label>
      <input type="color" id="edit-color">
      <label>Descrição</label>
      <textarea id="edit-desc" rows="3"></textarea>
      <label>Exemplo</label>
      <textarea id="edit-exemplo" rows="2"></textarea>
      <div class="modal-botoes">
        <button class="btn-cancelar" onclick="fecharEditor()">Cancelar</button>
        <button class="btn-salvar" onclick="salvarEdicao()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
